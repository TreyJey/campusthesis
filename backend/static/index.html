<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusThesis</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <h1 class="h3 mb-3">CampusThesis</h1>
        <p class="text-secondary">Платформа управления выпускными квалификационными работами</p>

        <div class="row g-3">
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Студентам</h2>
                        <p class="card-text">Выберите тему, подайте заявку и сдавайте этапы ВКР</p>
                        <span class="badge bg-success">Одобрено</span>
                        <span class="badge bg-warning text-dark">На проверке</span>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Руководителям</h2>
                        <p class="card-text">Рассматривайте заявки и проверяйте этапы работ</p>
                        <button class="btn btn-primary">Войти</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
