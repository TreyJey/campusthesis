<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — CampusThesis</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <h1 class="h3 text-center mb-1">CampusThesis</h1>
                <p class="text-center text-secondary mb-4">Платформа управления ВКР</p>

                <div class="card">
                    <div class="card-body p-4">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-input" class="form-label">Логин</label>
                                <input type="text" class="form-control" id="login-input" required>
                            </div>
                            <div class="mb-3">
                                <label for="password-input" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password-input" required>
                            </div>
                            <div id="login-message"></div>
                            <button type="submit" class="btn btn-primary w-100" id="btn-login">Войти</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script>
        // Словарь домашних страниц для ролей
        const HOME_PAGES = { student: "/student.html", supervisor: "/supervisor.html", admin: "/admin.html" };

        // Уже вошли - сразу на хомпейдж, логаут - localStorage.clear()
        const savedUser = getUser();
        if (savedUser) {
            window.location.href = HOME_PAGES[savedUser.role];
        }

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();  // не перезагружать страницу
            const button = document.getElementById("btn-login");
            button.disabled = true;
            try {
                const user = await api("/api/login", {
                    method: "POST",
                    body: {
                        login: document.getElementById("login-input").value.trim(),
                        password: document.getElementById("password-input").value
                    },
                });
                setUser(user);
                window.location.href = HOME_PAGES[user.role];
            } catch (error) {
                showMessage("login-message", error.message);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
